<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
         * La imagen original tiene proporción 3:2.
         * Ponemos la imagen y el botón dentro del mismo
         * contenedor para que la posición del botón
         * coincida también en celulares.
         */
        .pagina {
            position: relative;

            width: min(100vw, 150vh);
            height: min(100vh, 66.6667vw);

            aspect-ratio: 3 / 2;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .foto {
            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: contain;
            display: block;
        }


        /*
         * BOTÓN INVISIBLE DE SPOTIFY
         *
         * Esta zona queda exactamente encima del botón
         * "♡ abrir nuestra playlist ♡" de la imagen.
         */
        .boton-spotify {
            position: absolute;

            left: 40%;
            top: 70.2%;

            width: 28%;
            height: 7.5%;

            display: block;

            cursor: pointer;

            background: rgba(255, 255, 255, 0);

            border-radius: 30px;

            z-index: 5;

            text-decoration: none;
        }


        /*
         * Pequeño efecto cuando se pasa el mouse.
         * En celular no afecta.
         */
        .boton-spotify:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        .boton-spotify:active {
            transform: scale(0.98);
        }


        /*
         * CONTROL DE MÚSICA
         */
        .musica {
            position: fixed;

            right: 18px;
            bottom: 18px;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 224, 145, 0.90);

            color: #3b2b12;

            font-size: 18px;

            cursor: pointer;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);

            z-index: 20;

            transition: transform 0.2s ease;
        }

        .musica:hover {
            transform: scale(1.08);
        }

        .musica:active {
            transform: scale(0.95);
        }


        /*
         * En pantallas muy chicas dejamos un poco más
         * de espacio para el botón de música.
         */
        @media (max-width: 600px) {

            .musica {
                width: 40px;
                height: 40px;

                right: 12px;
                bottom: 12px;

                font-size: 17px;
            }
        }
    </style>
</head>


<body>

    <!-- PÁGINA -->
    <div class="pagina">

        <!-- IMAGEN -->
        <img
            src="foto.jpg"
            class="foto"
            alt=""
        >


        <!--
            BOTÓN INVISIBLE

            Al tocar esta zona se abre directamente
            la playlist de Spotify.
        -->
        <a
            href="https://open.spotify.com/playlist/00ttMyO5V3gLdmmTlZ4Ys2"
            target="_blank"
            rel="noopener noreferrer"
            class="boton-spotify"
            aria-label="Abrir nuestra playlist">
        </a>

    </div>


    <!-- AUDIO -->
    <audio
        id="audio"
        loop
        preload="auto">

        <source
            src="petal.mp3"
            type="audio/mpeg">

    </audio>


    <!-- BOTÓN DE MÚSICA -->
    <button
        class="musica"
        id="musica"
        aria-label="Reproducir música">

        ▶

    </button>


    <script>

        const audio = document.getElementById("audio");
        const botonMusica = document.getElementById("musica");

        let reproduciendo = false;


        /*
         * INICIAR MÚSICA
         */
        function reproducir() {

            audio.play()
                .then(() => {

                    reproduciendo = true;

                    botonMusica.textContent = "Ⅱ";

                })
                .catch(() => {

                    reproduciendo = false;

                    botonMusica.textContent = "▶";

                });

        }


        /*
         * PAUSAR MÚSICA
         */
        function pausar() {

            audio.pause();

            reproduciendo = false;

            botonMusica.textContent = "▶";

        }


        /*
         * BOTÓN DE MÚSICA
         */
        botonMusica.addEventListener("click", function(event) {

            /*
             * Evitamos que este click se propague
             * al resto de la página.
             */
            event.stopPropagation();

            if (reproduciendo) {

                pausar();

            } else {

                reproducir();

            }

        });


        /*
         * INTENTAR AUTOPLAY
         *
         * Algunos navegadores lo permitirán.
         * Si no lo permiten, el primer toque de la
         * pantalla iniciará la canción.
         */
        window.addEventListener("load", function() {

            reproducir();

        });


        /*
         * PRIMER TOQUE EN LA PÁGINA
         *
         * Esto permite que la canción empiece aunque
         * Chrome/Safari haya bloqueado el autoplay.
         */
        document.addEventListener("click", function() {

            if (!reproduciendo) {

                reproducir();

            }

        }, {
            once: true
        });


    </script>

</body>
</html>
