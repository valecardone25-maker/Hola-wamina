<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
        }

        .foto {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Zona invisible sobre "ABRIR NUESTRA PLAYLIST" */
        .boton-spotify {
            position: absolute;

            /*
              Ajustamos estas medidas para que coincidan
              con el botón que aparece en nuestra imagen.
            */
            width: 25%;
            height: 8%;

            left: 37.5%;
            top: 70.5%;

            cursor: pointer;
            border-radius: 30px;

            background: rgba(255,255,255,0);

            transition: transform 0.2s ease,
                        background 0.2s ease;
        }

        .boton-spotify:hover {
            transform: scale(1.04);
            background: rgba(255,255,255,0.08);
        }

        .boton-spotify:active {
            transform: scale(0.97);
        }

        /* Botón de música */
        .musica {
            position: fixed;
            bottom: 18px;
            right: 18px;

            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: rgba(255, 224, 145, 0.88);
            color: #3b2b12;

            font-size: 18px;
            cursor: pointer;

            box-shadow: 0 4px 20px rgba(0,0,0,0.4);

            z-index: 10;
        }

        .musica:hover {
            transform: scale(1.08);
        }

        /* En celular */
        @media (max-width: 700px) {

            .boton-spotify {
                width: 38%;
                height: 8%;

                left: 31%;
                top: 70%;
            }

            .musica {
                bottom: 12px;
                right: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <img
            src="foto.jpg"
            class="foto"
            alt=""
        >

        <!-- Zona invisible que hace clickeable el botón -->
        <a
            class="boton-spotify"
            href="https://open.spotify.com/playlist/00ttMyO5V3gLdmmTlZ4Ys2"
            target="_blank"
            aria-label="Abrir nuestra playlist">
        </a>

    </div>


    <!-- Audio -->
    <audio id="audio" loop>
        <source src="petal.mp3" type="audio/mpeg">
    </audio>


    <!-- Botón pequeño para activar/desactivar música -->
    <button
        class="musica"
        id="musica"
        aria-label="Reproducir música">
        ▶
    </button>


    <script>

        const audio = document.getElementById("audio");
        const botonMusica = document.getElementById("musica");

        let reproduciendo = false;


        function reproducir() {

            audio.play()
                .then(() => {

                    reproduciendo = true;
                    botonMusica.textContent = "Ⅱ";

                })
                .catch(() => {

                    reproduciendo = false;
                    botonMusica.textContent = "▶";

                });

        }


        function pausar() {

            audio.pause();

            reproduciendo = false;

            botonMusica.textContent = "▶";
        }


        botonMusica.addEventListener("click", function() {

            if (reproduciendo) {

                pausar();

            } else {

                reproducir();

            }

        });


        /*
         * Intentamos iniciar la canción automáticamente.
         * Algunos navegadores pueden bloquear el autoplay.
         */
        window.addEventListener("load", function() {

            reproducir();

        });


        /*
         * Si el navegador bloqueó el autoplay,
         * el primer toque/click en la página intenta
         * iniciar la canción.
         */
        document.addEventListener("click", function() {

            if (!reproduciendo) {

                reproducir();

            }

        }, { once: true });

    </script>

</body>
</html>
